name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - name: Mundo de referencia y 1 temporada con el motor de partido
        run: npm run gen -- --seed=123 --stats --seasons=1
      - name: Balance del motor (1 temporada)
        run: npm run sim -- --seasons=1 --seed=123
